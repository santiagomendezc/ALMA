name: Build iOS (sin firmar)

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la
# pestaña "Actions" de GitHub con el botón "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    # GitHub provee máquinas macOS con Xcode ya instalado, gratis (dentro
    # de un límite de minutos mensuales) para repos públicos y privados.
    runs-on: macos-latest

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar para iOS (sin firma de Apple)
        run: flutter build ios --release --no-codesign

      # Sin cuenta de Apple Developer no se puede generar un .ipa
      # instalable, pero este paso confirma que el proyecto compila
      # correctamente para iOS. El resultado queda en build/ios/iphoneos.
      - name: Guardar el resultado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-sin-firmar
          path: build/ios/iphoneos
